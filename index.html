<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>ลูกเต๋าสูงต่ำ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 12%,#2c3c5d,#101827 58%);color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center}
main{width:min(100%,480px);min-height:100svh;padding:24px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font-size:29px;margin:10px 0 3px}.sub{color:#b6c3d8;margin:0 0 20px;font-size:14px}
.dice{display:flex;gap:13px;justify-content:center;align-items:center;min-height:142px;margin:12px 0 14px}
.die{width:88px;height:88px;background:linear-gradient(145deg,#fff,#dfe7f1);border-radius:19px;box-shadow:0 9px 20px #0005;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13px;gap:3px}
.dot{width:13px;height:13px;border-radius:50%;background:#18243a;align-self:center;justify-self:center;opacity:0}.dot.on{opacity:1}
.rolling .die{animation:shake .14s infinite alternate}@keyframes shake{from{transform:translate(-3px,-2px) rotate(-5deg)}to{transform:translate(3px,2px) rotate(5deg)}}
.result{font-size:29px;font-weight:850;min-height:45px;margin:3px 0 2px}.total{color:#ffd166;font-size:17px;min-height:30px;margin-bottom:15px}
button{cursor:pointer}.toss{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#827aff,#5d54ec);color:white;font-weight:850;font-size:20px}.toss:disabled{opacity:.6}
.controls{display:flex;gap:10px;width:100%;margin-top:12px}.secondary{flex:1;background:#263550;color:#e6edfa;border:1px solid #ffffff18;border-radius:12px;padding:11px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;margin:21px 0 15px}.stat{background:#1c2940;border:1px solid #ffffff12;border-radius:14px;padding:12px 4px}.stat b{display:block;font-size:24px}.stat span{color:#b6c3d8;font-size:13px}
.history{width:100%;background:#1c2940;border:1px solid #ffffff12;border-radius:15px;padding:14px;text-align:left;flex:1;min-height:115px}.history h2{font-size:16px;margin:0}
#entries{padding-left:22px;margin:8px 0 0;font-size:14px;line-height:1.9;color:#e5eaf4}.empty{text-align:center;color:#b6c3d8;font-size:14px;padding:20px 0}
.note{font-size:12px;color:#9eabc2;line-height:1.6;margin:14px 0 0}
</style></head><body><main>
<h1>🎲 ลูกเต๋าสูง–ต่ำ</h1><p class="sub">ทอยลูกเต๋า 3 ลูก พร้อมเสียงประกาศผล</p>
<div class="dice" id="diceArea"><div class="die" id="die0"></div><div class="die" id="die1"></div><div class="die" id="die2"></div></div>
<div class="result" id="result" aria-live="polite">พร้อมทอยหรือยัง?</div><div class="total" id="total">แต้มรวม —</div>
<button class="toss" id="toss">🎲 ทอยลูกเต๋า</button>
<div class="controls"><button class="secondary" id="sound">🔊 เสียง: เปิด</button><button class="secondary" id="reset">ล้างสถิติ</button></div>
<section class="stats"><div class="stat"><b id="high">0</b><span>สูง</span></div><div class="stat"><b id="low">0</b><span>ต่ำ</span></div><div class="stat"><b id="count">0</b><span>ทอยทั้งหมด</span></div></section>
<section class="history"><h2>ประวัติการทอย</h2><div id="empty" class="empty">ยังไม่มีประวัติ</div><ol id="entries"></ol></section>
<p class="note">แต้มรวม 3–10 = ต่ำ · 11–18 = สูง<br>เลข 11 เป็น “สูง” ตามปกติ ไม่มีโบนัสหรือกติกากินเรียบ</p>
</main><script>
const $=id=>document.getElementById(id);let high=0,low=0,count=0,history=[],soundOn=true;
const patterns={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function draw(el,n){el.innerHTML='';for(let i=0;i<9;i++){let d=document.createElement('i');d.className='dot'+(patterns[n].includes(i)?' on':'');el.appendChild(d)}}
for(let i=0;i<3;i++)draw($('die'+i),1);
function speak(t){if(!soundOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.rate=.92;speechSynthesis.speak(u)}
function render(){$('high').textContent=high;$('low').textContent=low;$('count').textContent=count;$('entries').innerHTML='';$('empty').style.display=history.length?'none':'block';history.forEach(x=>{let li=document.createElement('li');li.textContent=x;$('entries').appendChild(li)})}
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 เสียง: เปิด':'🔇 เสียง: ปิด';if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel()};
$('reset').onclick=()=>{if(!confirm('ล้างสถิติและประวัติทั้งหมดใช่ไหม?'))return;high=low=count=0;history=[];$('result').textContent='พร้อมทอยหรือยัง?';$('total').textContent='แต้มรวม —';for(let i=0;i<3;i++)draw($('die'+i),1);render()};
$('toss').onclick=()=>{let btn=$('toss'),area=$('diceArea');btn.disabled=true;$('result').textContent='กำลังเขย่าลูกเต๋า...';$('total').textContent='รอลุ้นผล...';let vals=Array.from({length:3},()=>Math.floor(Math.random()*6)+1);area.classList.add('rolling');let ticks=0;let timer=setInterval(()=>{for(let i=0;i<3;i++)draw($('die'+i),Math.floor(Math.random()*6)+1);if(++ticks>=8){clearInterval(timer);area.classList.remove('rolling');vals.forEach((v,i)=>draw($('die'+i),v));let sum=vals.reduce((a,b)=>a+b,0),isHigh=sum>=11,label=isHigh?'สูง':'ต่ำ';if(isHigh)high++;else low++;count++;$('result').textContent=label;$('total').textContent=`${vals.join(' + ')} = ${sum} แต้ม`;history.unshift(`${vals.join('-')} รวม ${sum} แต้ม — ${label}`);history=history.slice(0,25);render();speak(`ออก${label} แต้มรวม ${sum}`);btn.disabled=false}},110)};
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
